name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/precache_nushell.py
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: moon update
      - run: moon check --target native --deny-warn
      - run: moon build --target native --deny-warn
      - run: python scripts/protocol_reference.py
      - run: python scripts/conversion_reference.py --check
      - run: python scripts/check_docs.py
      - id: package_scope
        run: python scripts/package_scope.py
      - if: steps.package_scope.outputs.required == 'true'
        run: python scripts/package_acceptance.py
      - if: steps.package_scope.outputs.required == 'true'
        run: moon package --frozen
      - if: steps.package_scope.outputs.required == 'true'
        run: python scripts/patch_compatibility.py
      - run: moon test --target native --deny-warn
      - run: moon test client/state_machine_test.mbt --target native --deny-warn
        env:
          CQL_TEST_SEED: '2026102501'
          CQL_TEST_ROUNDS: '16'
      - run: moon run cmd/value-mapping
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-reference.txt
      - run: python -m unittest discover -s scripts/tests
      - run: python scripts/differential.py
      - run: python scripts/tls_matrix.py
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code
      - run: python scripts/check_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-and-differential-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .artifacts/**/result.json
            .artifacts/package-acceptance-*/**/*.log
  integration:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        auth: [none, password]
        compression: [none, lz4]
    runs-on: ubuntu-latest
    env:
      CQL_AUTHENTICATOR: ${{ matrix.auth == 'password' && 'PasswordAuthenticator' || 'AllowAllAuthenticator' }}
      CQL_COMPRESSION: ${{ matrix.compression }}
      CQL_ASSERT_V5_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: package_scope
        run: python scripts/package_scope.py
      - run: python scripts/precache_nushell.py
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: moon update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-reference.txt
      - run: python scripts/routing_reference.py
      - run: docker compose up -d --wait --wait-timeout 360
      - name: Validate v5 queries and independent interoperability
        run: |
          if [ "$CQL_AUTHENTICATOR" = PasswordAuthenticator ]; then
            export CQL_USERNAME=cassandra CQL_PASSWORD=cassandra
          fi
          python scripts/short_acceptance.py --auth '${{ matrix.auth }}' --compression '${{ matrix.compression }}'
          if [ '${{ matrix.auth }}/${{ matrix.compression }}' = 'none/none' ]; then
            moon run cmd/readme
          fi
          moon run cmd/features
          CQL_POOL_SIZE=3 moon run cmd/features
          CQL_MAPPING_INTEGRATION=1 moon run cmd/value-mapping
          python scripts/prometheus_acceptance.py
          moon run cmd/profiles
          moon run cmd/limits
          CQL_POOL_SIZE=3 moon run cmd/limits
          python scripts/schema_reference.py
          if [ '${{ matrix.auth }}/${{ matrix.compression }}' = 'password/lz4' ]; then
            if [ "$RUN_PACKAGE_ACCEPTANCE" = true ]; then
              python scripts/package_acceptance.py --run
            fi
            python scripts/pooling_evaluation.py --smoke
            python scripts/pooling_evaluation.py --session --smoke
          fi
          python scripts/tls_matrix.py --backend-port 9042
          python scripts/session_recovery.py --docker-compose
        env:
          RUN_PACKAGE_ACCEPTANCE: ${{ steps.package_scope.outputs.required }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-acceptance-${{ matrix.auth }}-${{ matrix.compression }}
          include-hidden-files: true
          path: |
            .artifacts/**/result.json
            .artifacts/**/integration.json
            .artifacts/**/interop.json
            .artifacts/short-acceptance-*/**/*.log
            .artifacts/package-acceptance-*/**/*.log
            .artifacts/schema-reference-*/**/*.log
            .artifacts/schema-reference-*/**/*.json
            .artifacts/pooling-evaluation-*/**/*.log
            .artifacts/pooling-evaluation-*/records.jsonl
            .artifacts/prometheus-*/
      - if: always()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down --volumes
  native-tls:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/precache_nushell.py
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: moon update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-reference.txt
      - run: python scripts/native_tls_acceptance.py --docker-compose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassandra-native-tls
          include-hidden-files: true
          path: .artifacts/native-tls-*/
  multidc:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/precache_nushell.py
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: moon update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-reference.txt
      - run: docker compose -f compose.cluster.yaml -f compose.multidc.yaml up -d --wait --wait-timeout 360
      - run: python scripts/multidc_acceptance.py --docker-compose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multidc-acceptance
          include-hidden-files: true
          path: .artifacts/multidc-*/
      - if: always()
        run: docker compose -f compose.cluster.yaml -f compose.multidc.yaml logs --tail=80
      - if: always()
        run: docker compose -f compose.cluster.yaml -f compose.multidc.yaml down --volumes
  cluster:
    needs: unit
    runs-on: ubuntu-latest
    env:
      CQL_AUTHENTICATOR: PasswordAuthenticator
      CQL_USERNAME: cassandra
      CQL_PASSWORD: cassandra
      CQL_COMPRESSION: lz4
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/precache_nushell.py
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - run: moon update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker compose -f compose.cluster.yaml up -d --wait --wait-timeout 360
      - run: python -m pip install -r scripts/requirements-reference.txt
      - run: python scripts/discovery_recovery.py --docker-compose
      - run: moon run cmd/limits
        env:
          CQL_CONTACT_PORTS: '19052,19053,19054'
          CQL_POOL_SIZE: '2'
      - run: python scripts/cluster_failover.py --docker-compose
      - if: always()
        run: docker compose -f compose.cluster.yaml logs --tail=80
      - if: always()
        run: docker compose -f compose.cluster.yaml down --volumes
