name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon check --target native --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code
  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      cassandra:
        image: cassandra:5.0.5
        env:
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 100M
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT release_version FROM system.local'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-reference.txt
      - run: moon run cmd/integration
      - run: python scripts/interop.py
